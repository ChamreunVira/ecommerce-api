name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 2. Copy the newly built JAR to EC2
      - name: Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT }}
          username: ubuntu
          key: ${{ secrets.EC2_SECRET }}
          source: "target/*.jar"
          target: "/home/ubuntu/app-staging"
          strip_components: 1

      # 3. Stop service, install new JAR with permissions, and start service
      - name: Deploy and Restart Service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT }}
          username: ubuntu
          key: ${{ secrets.EC2_SECRET }}
          script: |
            mv /home/ubuntu/app-staging/*.jar /home/ubuntu/app.jar.new
            sudo systemctl stop vstore.service
            sudo install -o vstore -g vstore -m 640 /home/ubuntu/app.jar.new /opt/vstore/app.jar
            sudo systemctl start vstore.service