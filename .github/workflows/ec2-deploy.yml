
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/ecommerce-api-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact
          path: ./artifact

      - name: Configure SSH
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          scp -i ~/.ssh/id_rsa \
            -P "$EC2_PORT" \
            ./artifact/ecommerce-api-0.0.1-SNAPSHOT.jar \
            "ubuntu@$EC2_HOST:/home/ubuntu/ecommerce-api-0.0.1-SNAPSHOT.jar"

      - name: Install JAR and restart service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p "$EC2_PORT" \
            "ubuntu@$EC2_HOST" 'bash -se' <<'REMOTE'
              set -eu

              echo "Connected to: $(hostname)"

              echo "Checking Java version..."
              java -version

              echo "Backing up current JAR..."
              if sudo test -f /opt/vstore/app.jar; then
                sudo cp -a /opt/vstore/app.jar /opt/vstore/app.jar.bak
              fi

              echo "Installing new JAR..."
              sudo install \
                -o vstore \
                -g vstore \
                -m 640 \
                /home/ubuntu/ecommerce-api-0.0.1-SNAPSHOT.jar \
                /opt/vstore/app.jar

              echo "Restarting Spring Boot..."
              sudo systemctl restart vstore

              echo "Checking service status..."
              if ! sudo systemctl is-active --quiet vstore; then
                sudo journalctl -u vstore -n 100 --no-pager
                exit 1
              fi  

              echo "Deployment successful!"
              sudo systemctl status vstore --no-pager
              sudo journalctl -u vstore -n 30 --no-pager
          REMOTE
