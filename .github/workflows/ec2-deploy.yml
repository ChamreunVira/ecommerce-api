# .github/workflows/deploy.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vstore-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean package -DskipTests

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="target/ecommerce-api-0.0.1-SNAPSHOT.jar"

          if [[ ! -s "$JAR" ]]; then
            echo "ERROR: Expected JAR was not created: $JAR"
            exit 1
          fi

          ls -lh "$JAR"
          sha256sum "$JAR"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/ecommerce-api-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact
          path: ./artifact

      - name: Verify downloaded JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="./artifact/ecommerce-api-0.0.1-SNAPSHOT.jar"

          if [[ ! -s "$JAR" ]]; then
            echo "ERROR: Downloaded JAR is missing or empty."
            exit 1
          fi

          ls -lh "$JAR"
          sha256sum "$JAR"

      - name: Configure SSH
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        shell: bash
        run: |
          set -euo pipefail

          : "${EC2_KEY:?Missing GitHub secret EC2_KEY}"
          : "${EC2_HOST:?Missing GitHub secret EC2_HOST}"
          : "${EC2_PORT:?Missing GitHub secret EC2_PORT}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Copy JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -P "$EC2_PORT" \
            ./artifact/ecommerce-api-0.0.1-SNAPSHOT.jar \
            "ubuntu@$EC2_HOST:/home/ubuntu/app-new.jar"

      - name: Install JAR, restart, and verify
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -p "$EC2_PORT" \
            "ubuntu@$EC2_HOST" \
            "bash -s -- '$APP_HEALTH_URL'" <<'REMOTE'
          set -Eeuo pipefail

          HEALTH_URL="${1:-}"
          APP="/opt/vstore/app.jar"
          NEW_JAR="/home/ubuntu/app-new.jar"
          SERVICE="vstore.service"
          BACKUP="/opt/vstore/app.jar.bak"

          echo "Connected to: $(hostname)"

          echo "Checking Java..."
          java -version

          echo "Checking uploaded JAR..."
          sudo test -s "$NEW_JAR"

          echo "Checking destination directory..."
          sudo test -d /opt/vstore

          # Preserve the previous JAR before replacing it.
          if sudo test -f "$APP"; then
            echo "Backing up the current JAR..."
            sudo cp -a "$APP" "$BACKUP"
          else
            echo "ERROR: Existing JAR not found. Aborting deployment."
            exit 1
          fi

          # Stop the application before installing the new JAR.
          echo "Stopping $SERVICE..."
          sudo systemctl stop "$SERVICE"

          # Install the new JAR with the expected ownership and mode.
          echo "Installing the new JAR..."
          sudo install -o vstore -g vstore -m 640 "$NEW_JAR" "$APP"

          echo "Installed JAR checksum:"
          sudo sha256sum "$APP"

          # Roll back automatically if startup or verification fails.
          rollback() {
            echo "ERROR: Deployment failed. Restoring previous JAR..."

            sudo systemctl stop "$SERVICE" || true

            if sudo test -f "$BACKUP"; then
              sudo cp -a "$BACKUP" "$APP"
              sudo chown vstore:vstore "$APP"
              sudo chmod 640 "$APP"

              sudo systemctl restart "$SERVICE" || true
              sleep 3
              sudo systemctl status "$SERVICE" --no-pager || true
              sudo journalctl -u "$SERVICE" -n 80 --no-pager || true
            else
              echo "ERROR: No backup available for rollback."
            fi
          }

          if ! sudo systemctl start "$SERVICE"; then
            rollback
            exit 1
          fi

          echo "Waiting for application startup..."
          for attempt in $(seq 1 30); do
            if ! sudo systemctl is-active --quiet "$SERVICE"; then
              echo "ERROR: Service stopped during startup."
              rollback
              exit 1
            fi

            sleep 2
          done

          # If configured, require a successful HTTP health check.
          if [[ -n "$HEALTH_URL" ]]; then
            echo "Checking application health: $HEALTH_URL"
            healthy=false

            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error \
                --max-time 5 "$HEALTH_URL" >/dev/null 2>&1; then
                healthy=true
                break
              fi

              sleep 2
            done

            if [[ "$healthy" != true ]]; then
              echo "ERROR: Application health check failed."
              rollback
              exit 1
            fi
          else
            echo "WARNING: APP_HEALTH_URL is not configured."
            echo "Only systemd status has been verified."
          fi

          echo "Verifying JAR permissions..."
          sudo stat -c '%U:%G %a %n' "$APP"

          echo "Deployment successful!"
          sudo systemctl status "$SERVICE" --no-pager
          sudo journalctl -u "$SERVICE" -n 40 --no-pager
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa