
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vstore-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean package -DskipTests

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="target/ecommerce-api-0.0.1-SNAPSHOT.jar"

          if [[ ! -s "$JAR" ]]; then
            echo "ERROR: JAR was not created."
            exit 1
          fi

          echo "Build artifact:"
          ls -lh "$JAR"

          echo "Build checksum:"
          sha256sum "$JAR"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/ecommerce-api-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact
          path: ./artifact

      - name: Verify downloaded JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="./artifact/ecommerce-api-0.0.1-SNAPSHOT.jar"

          if [[ ! -s "$JAR" ]]; then
            echo "ERROR: Downloaded JAR is missing."
            exit 1
          fi

          echo "Downloaded artifact:"
          ls -lh "$JAR"

          sha256sum "$JAR"

      - name: Configure SSH
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        shell: bash
        run: |
          set -euo pipefail

          : "${EC2_KEY:?Missing EC2_KEY}"
          : "${EC2_HOST:?Missing EC2_HOST}"
          : "${EC2_PORT:?Missing EC2_PORT}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload new JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -P "$EC2_PORT" \
            ./artifact/ecommerce-api-0.0.1-SNAPSHOT.jar \
            "ubuntu@$EC2_HOST:/home/ubuntu/app-new.jar"

      - name: Install JAR, restart, and verify
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -p "$EC2_PORT" \
            "ubuntu@$EC2_HOST" \
            "bash -s -- '$APP_HEALTH_URL'" <<'REMOTE'

          set -Eeuo pipefail

          HEALTH_URL="${1:-}"
          APP="/opt/vstore/app.jar"
          NEW_JAR="/home/ubuntu/app-new.jar"
          SERVICE="vstore.service"

          echo "================================"
          echo "Connected to: $(hostname)"
          echo "================================"

          echo "Checking Java..."
          java -version

          echo "Checking uploaded JAR..."
          sudo test -s "$NEW_JAR"

          echo "Checking application directory..."
          sudo test -d /opt/vstore

          echo "Stopping application..."
          sudo systemctl stop "$SERVICE"

          echo "Installing new JAR..."
          sudo install -o vstore -g vstore -m 640 "$NEW_JAR" "$APP"

          echo "Verifying installed JAR..."
          sudo cmp --silent "$NEW_JAR" "$APP" || {
            echo "ERROR: Installed JAR does not match uploaded JAR."
            exit 1
          }

          echo "Installed JAR checksum:"
          sudo sha256sum "$APP"

          echo "Removing temporary uploaded JAR..."
          rm -f "$NEW_JAR"

          echo "Starting application..."
          sudo systemctl start "$SERVICE"

          echo "Waiting for application startup..."

          HEALTHY=false

          for attempt in $(seq 1 30); do

            if ! sudo systemctl is-active --quiet "$SERVICE"; then
              echo "ERROR: Application stopped during startup."
              sudo journalctl -u "$SERVICE" -n 100 --no-pager
              exit 1
            fi

            if [[ -n "$HEALTH_URL" ]]; then
              if curl --fail --silent --max-time 5 \
                "$HEALTH_URL" >/dev/null 2>&1; then
                HEALTHY=true
                break
              fi
            else
              if [[ "$attempt" -eq 30 ]]; then
                HEALTHY=true
              fi
            fi

            sleep 2
          done

          if [[ "$HEALTHY" != true ]]; then
            echo "ERROR: Application health check failed."
            sudo systemctl status "$SERVICE" --no-pager || true
            sudo journalctl -u "$SERVICE" -n 100 --no-pager
            exit 1
          fi

          echo "================================"
          echo "Deployment successful!"
          echo "================================"

          echo "JAR permissions:"
          sudo stat -c '%U:%G %a %n' "$APP"

          echo "Service status:"
          sudo systemctl status "$SERVICE" --no-pager

          echo "Recent application logs:"
          sudo journalctl -u "$SERVICE" -n 40 --no-pager

          REMOTE

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/id_rsa
